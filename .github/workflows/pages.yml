name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
      - "scripts/generate_case_guides.py"
      - "scripts/generate_case_matrix.py"
      - "scripts/generate_documentation_pdf.py"
      - "scripts/verify_documentation_*.py"
      - "src/payments_lab/playbooks.py"
      - "config/case_guides.json"
      - "config/payment_rails.yaml"
      - "output/pdf/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation toolchain
        run: |
          python -m pip install -r requirements-docs.txt
          python -m playwright install chromium
      - name: Generate and verify navigable PDF
        run: |
          python scripts/generate_documentation_pdf.py
          python scripts/verify_documentation_pdf.py
      - name: Build Markdown documentation
        run: mkdocs build --strict
      - name: Verify every Mermaid diagram in Chromium
        run: |
          python -m mkdocs serve -a 127.0.0.1:8000 &
          server_pid=$!
          sleep 3
          python scripts/verify_documentation_ui.py --origin http://127.0.0.1:8000/universal-payments-engineering-lab
          kill "$server_pid"
      - name: Add PDF download to Pages artifact
        run: |
          mkdir -p site/downloads
          cp output/pdf/universal-payments-engineering-lab.pdf site/downloads/
      - name: Verify generated pages and internal links
        run: python scripts/verify_documentation_site.py --site-dir site
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
