name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install -e ".[dev]"
      - name: Static checks
        run: python -m ruff check src tests scripts
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Repository coherence
        run: python scripts/verify_repository.py

  package:
    name: Reproducible package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: python -m pip install build && python -m build
      - name: Install wheel and run CLI
        run: |
          python -m pip install dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          paylab states
          paylab doctor
          paylab catalog > /dev/null
          paylab demo cash > /dev/null
          python -c "import threading, urllib.request; from payments_lab.web import create_server; server=create_server(port=0); thread=threading.Thread(target=server.serve_forever, daemon=True); thread.start(); response=urllib.request.urlopen(f'http://127.0.0.1:{server.server_port}/', timeout=2); assert response.status == 200 and b'PayLab' in response.read(); server.shutdown(); server.server_close(); thread.join(timeout=2)"
