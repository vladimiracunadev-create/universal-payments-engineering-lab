schema_version: 2
catalog_reviewed_at: "2026-09-07"
status_legend:
  OPERATIVE_LOCAL: executable without external financial infrastructure
  REQUIRES_CREDENTIALS: adapter exists; authorized provider credentials are required
  REQUIRES_CERTIFICATION: contracts, onboarding or scheme certification are required
  REQUIRES_HARDWARE: certified or physical infrastructure is required
  DOCUMENTED: engineering and curriculum coverage; no executable external integration
families:
  - id: cash
    instrument: bearer_value
    cases: [cash-register, cash-on-delivery, cash-in, cash-out, bank-deposit]
    technologies: [cash-management, counterfeit-detection, chain-of-custody]
    status: DOCUMENTED
  - id: paper
    instrument: payment_order
    cases: [cheque, cashiers-cheque, bank-draft, money-order]
    technologies: [image-clearing, micr, batch-clearing]
    status: DOCUMENTED
  - id: cards
    instrument: card_account
    cases: [credit, debit, prepaid, commercial, card-present, card-not-present, recurring, installments]
    technologies: [iso8583, emv-chip, emv-contactless, 3ds, tokenization, hsm, pci-dss]
    status: REQUIRES_CERTIFICATION
  - id: chile-webpay
    instrument: card_account
    cases: [webpay-plus-create, commit, status, refund]
    technologies: [rest-json, redirect, tls]
    status: REQUIRES_CREDENTIALS
    adapter: payments_lab.adapters.transbank.WebpayPlusProvider
  - id: chile-khipu
    instrument: bank_account
    cases: [instant-payment, query, delete, void, refund]
