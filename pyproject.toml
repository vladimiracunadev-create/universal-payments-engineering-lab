[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-payments-engineering-lab"
version = "0.1.0"
description = "Laboratorio profesional de ingeniería y operación de pagos multi-rail"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Vladimir Acuña"}]
keywords = ["payments", "fintech", "ledger", "reconciliation", "idempotency", "payment-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/vladimiracunadev-create/universal-payments-engineering-lab"
Documentation = "https://github.com/vladimiracunadev-create/universal-payments-engineering-lab/tree/main/docs"
Issues = "https://github.com/vladimiracunadev-create/universal-payments-engineering-lab/issues"

[project.scripts]
paylab = "payments_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
