[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-payments-engineering-lab"
version = "0.1.0"
description = "Laboratorio profesional de ingeniería y operación de pagos multi-rail"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vladimir Acuña"}]
keywords = ["payments", "fintech", "ledger", "reconciliation", "idempotency", "payment-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1"]

[project.urls]
Homepage = "https://github.com/vladimiracunadev-create/universal-payments-engineering-lab"
Documentation = "https://github.com/vladimiracunadev-create/universal-payments-engineering-lab/tree/main/docs"
Issues = "https://github.com/vladimiracunadev-create/universal-payments-engineering-lab/issues"

[project.scripts]
paylab = "payments_lab.cli:main"
paylab-web = "payments_lab.web:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
config = ["config/payment_rails.yaml", "config/case_guides.json"]
"share/paylab/web" = ["web/index.html", "web/styles.css", "web/app.js", "web/icons.svg"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
